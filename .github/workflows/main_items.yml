# Build y deploy de la plataforma de items (FastAPI + React) a la Azure Web App "items".
# Un solo servicio: el build de React se copia a backend/static y FastAPI lo sirve;
# /api/* va a la API (ver plataforma-web/backend/app/main.py -> servidor).
# Docs: https://github.com/Azure/webapps-deploy  ·  https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - items

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      # --- Frontend (React + Vite) ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: plataforma-web/frontend/package-lock.json

      - name: Build frontend
        working-directory: plataforma-web/frontend
        run: |
          npm ci
          npm run build

      # --- Paquete a desplegar: solo el backend + el frontend compilado ---
      # (no viajan los scripts de la raiz, sql/ ni la documentacion)
      - name: Assemble deployment package
        run: |
          mkdir deploy
          cp -r plataforma-web/backend/app plataforma-web/backend/requirements.txt deploy/
          cp -r plataforma-web/frontend/dist deploy/static

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Antes de desplegar: las dependencias instalan y la app importa sin .env
      # (en Azure la configuracion llega por las variables de entorno de la Web App).
      - name: Install dependencies and check the app
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r deploy/requirements.txt
          cd deploy
          python -c "import app.main as m; assert m.servidor is not m.app, 'falta static/index.html'"

      # Con SCM_DO_BUILD_DURING_DEPLOYMENT=true (lo pone Azure) Oryx hace el pip install
      # en el servidor; por eso antenv (que queda fuera de deploy/) no viaja.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AA9BF82297744F1CBC6BBC2984E6BFE4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F99513C5C6074673B7B7F222B494443E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3337859569964603A25F704945195EC7 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'items'
          slot-name: 'Production'
          # Un solo proceso a proposito: los cargues de planeacion usan un candado en memoria.
          startup-command: 'python -m uvicorn app.main:servidor --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"'
